<header class="app-header">
  <a class="brand" routerLink="/dashboard">Digital Banking</a>

  <nav>
    @if (authService.isAuthenticated()) {
      <a routerLink="/customers">Clients</a>
      <span>{{ authService.username() }}</span>
      <button type="button" (click)="authService.logout()">Déconnexion</button>
    } @else {
      <a routerLink="/login">Connexion</a>
      <a routerLink="/register">Inscription</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
